[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-act-assistant"
version = "0.1.0"
description = "Agent RAG de conformité AI Act : réponses citées, validation humaine et journal d'audit."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Yannis Bouharaoua" }]
dependencies = [
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=3.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
azure = ["openai>=1.50"]
dense = ["sentence-transformers>=3.0"]
fetch = ["httpx>=0.27", "beautifulsoup4>=4.12"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
ai-act = "ai_act_assistant.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_act_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
